[project]
name = "northbank-fc-agent"
version = "0.1.0"
description = "Local MCP-backed membership support triage prototype"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.12,<2",
  "typesafe-sdk>=0.7.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
